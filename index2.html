<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>かんじ クイズ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        h1 {
            color: #ff6f61;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        #menu-screen, #quiz-screen, #result-screen {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            text-align: center;
        }
        .category-section {
            margin-bottom: 25px;
            text-align: left;
            background: #fff9e6;
            padding: 15px;
            border-radius: 15px;
            border: 2px dashed #ffcc00;
        }
        .category-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 10px;
            padding-left: 5px;
            border-left: 5px solid #e67e22;
        }
        .kanji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 10px;
        }
        .kanji-btn {
            font-size: 1.8rem;
            padding: 5px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .kanji-btn:hover {
            background: #e3f2fd;
            border-color: #2196f3;
            transform: scale(1.05);
        }
        .kanji-btn.selected {
            background: #2196f3;
            color: white;
            border-color: #0d47a1;
        }
        .control-btn {
            font-size: 1.2rem;
            padding: 12px 30px;
            margin: 15px 5px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .start-btn { background: #4caf50; color: white; }
        .start-btn:hover { background: #45a049; }
        .back-btn { background: #f44336; color: white; }
        .back-btn:hover { background: #da190b; }
        
        #kanji-display {
            font-size: 8rem;
            margin: 40px 0;
            font-weight: bold;
            color: #2c3e50;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .choice-btn {
            font-size: 1.8rem;
            padding: 20px;
            background: #f8f9fa;
            border: 3px solid #e9ecef;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .choice-btn:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        #score-display {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #7f8c8d;
        }
        #result-text {
            font-size: 2rem;
            font-weight: bold;
            margin: 30px 0;
            color: #2ecc71;
        }
    </style>
</head>
<body>

    <h1>かんじ クイズ</h1>

    <!-- メニュー画面 -->
    <div id="menu-screen">
        <p style="font-size: 1.2rem; margin-bottom: 20px;">クイズにだしたい漢字をえらんでね！（なんこでもOK）</p>
        <div style="margin-bottom: 15px;">
            <button class="control-btn" style="background:#9e9e9e; color:white; padding: 6px 15px; font-size: 0.9rem;" onclick="selectAllKanji(true)">すべてえらぶ</button>
            <button class="control-btn" style="background:#9e9e9e; color:white; padding: 6px 15px; font-size: 0.9rem;" onclick="selectAllKanji(false)">ぜんぶ消す</button>
        </div>
        
        <div id="category-container"></div>
        
        <button class="control-btn start-btn" onclick="startQuiz()">クイズ スタート！</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" style="display: none;">
        <div id="score-display">もんめ: <span id="current-question">1</span> / <span id="total-questions">0</span></div>
        <div id="kanji-display"></div>
        <div class="choice-grid">
            <button class="choice-btn" onclick="checkAnswer(0)"></button>
            <button class="choice-btn" onclick="checkAnswer(1)"></button>
            <button class="choice-btn" onclick="checkAnswer(2)"></button>
            <button class="choice-btn" onclick="checkAnswer(3)"></button>
        </div>
        <button class="control-btn back-btn" onclick="backToMenu()">メニューにもどる</button>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" style="display: none;">
        <h2>クイズおわり！</h2>
        <div id="result-text"></div>
        <button class="control-btn start-btn" onclick="backToMenu()">もういちど あそぶ</button>
    </div>

    <script>
        // 漢字のデータ（ジャンルは維持、中身を関連度順・セットになるよう並び替え）
        const kanjiCategories = {
          "数と言葉・時・方角": [
            // 数・単位・順序
            "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "百", "千", "万", "半", "数", "番", "度", "回",
            // 時・季節・カレンダー（ご要望のセット）
            "春", "夏", "秋", "冬", "朝", "昼", "夜", "時", "分", "週", "曜", "月", "日", "年", "今", "前", "後", "間",
            // 方角・位置
            "東", "西", "南", "北", "方", "上", "下", "左", "右", "遠", "近", "内", "外", "高", "長", "太", "細", "直", "丸", "角"
          ],
          "人と体・生活・家": [
            // 家族・人・呼び名
            "父", "母", "兄", "弟", "姉", "妹", "親", "子", "男", "女", "人", "名", "古", "少", "多",
            // 体の部位・状態
            "目", "耳", "口", "手", "足", "頭", "心", "顔", "体", "才", "毛", "活", "生",
            // 家・建物・生活の道具
            "家", "室", "戸", "門", "場", "園", "店", "売", "買", "食", "飲", "紙", "画", "図", "工", "刀", "弓", "矢", "衣"
          ],
          "自然・生き物・地名・天候": [
            // 天体・天候
            "天", "気", "晴", "風", "雲", "雪", "電", "光", "星", "明", "暗",
            // 自然の地形・エレメント
            "山", "川", "海", "岩", "石", "谷", "池", "地", "場", "野", "原", "里", "道", "国", "社",
            // 植物・農作物
            "木", "林", "森", "竹", "草", "花", "米", "麦",
            // 生き物
            "鳥", "魚", "虫", "馬", "牛", "羊", "肉", "羽", "毛"
          ],
          "いろいろな言葉・その他": [
            // 色（ご要望のセット）
            "色", "黄", "黒", "茶", "白", "赤", "青",
            // 動作・行動
            "行", "来", "出", "入", "走", "歩", "止", "立", "坐", "思", "考", "言", "話", "語", "書", "読", "聞", "見",
            // 学校・学習
            "学", "校", "教", "室", "文", "字", "本", "作", "用", "強", "弱",
            // 状態・その他
            "新", "古", "長", "短", "高", "低", "多", "少", "大", "小", "何", "元", "交", "当"
          ]
        };

        // 漢字の読み方辞書データ
        const kanjiDict = {
            "一": "いち", "二": "に", "三": "さん", "四": "よん", "五": "ご", "六": "ろく", "七": "なな", "八": "はち", "九": "きゅう", "十": "じゅう",
            "百": "ひゃく", "千": "せん", "万": "まん", "半": "はん", "数": "すう", "番": "ばん", "度": "ど", "回": "かい",
            "春": "はる", "夏": "なつ", "秋": "あき", "冬": "ふゆ", "朝": "あさ", "昼": "ひる", "夜": "よる", "時": "とき", "分": "ふん",
            "週": "しゅう", "曜": "よう", "月": "つき", "日": "ひ", "年": "とし", "今": "いま", "前": "まえ", "後": "うしろ", "間": "あいだ",
            "東": "ひがし", "西": "にし", "南": "みなみ", "北": "きた", "方": "ほう", "上": "うえ", "下": "した", "左": "ひだり", "右": "みぎ",
            "遠": "とおい", "近": "ちかい", "内": "うち", "外": "そと", "高": "たかい", "長": "ながい", "太": "ふとい", "細": "ほそい", "直": "ちょく", "丸": "まる", "角": "かく",
            "父": "ちち", "母": "はは", "兄": "あに", "弟": "おとうと", "姉": "あね", "妹": "いもうと", "親": "おや", "子": "こ", "男": "おとこ", "女": "おんな",
            "人": "ひと", "名": "な", "古": "ふるい", "少": "すこし", "多": "おおい", "目": "め", "耳": "みみ", "口": "くち", "手": "て", "足": "あし",
            "頭": "あたま", "心": "こころ", "顔": "かお", "体": "からだ", "才": "さい", "毛": "け", "活": "かつ", "生": "いきる",
            "家": "いえ", "室": "しつ", "戸": "と", "門": "もん", "場": "ばしょ", "園": "えん", "店": "みせ", "売": "うる", "買": "かう",
            "食": "たべる", "飲": "のむ", "紙": "かみ", "画": "が", "図": "ず", "工": "こう", "刀": "かたな", "弓": "ゆみ", "矢": "や", "衣": "ころも",
            "天": "てん", "気": "き", "晴": "はれ", "風": "かぜ", "雲": "くも", "雪": "ゆき", "電": "でん", "光": "ひかり", "星": "ほし", "明": "あかるい", "暗": "くらい",
            "山": "やま", "川": "かわ", "海": "うみ", "岩": "いわ", "石": "いし", "谷": "たに", "池": "いけ", "地": "ち", "野": "の", "原": "はら",
            "里": "さと", "道": "みち", "国": "くに", "社": "しゃ", "木": "き", "林": "はやし", "森": "もり", "竹": "たけ", "草": "くさ", "花": "花",
            "米": "こめ", "麦": "むぎ", "鳥": "とり", "魚": "さかな", "虫": "むし", "馬": "うま", "牛": "うし", "羊": "ひつじ", "肉": "にく", "羽": "はね",
            "色": "いろ", "黄": "きいろ", "黒": "くろ", "茶": "ちゃ", "白": "しろ", "赤": "あか", "青": "あお",
            "行": "いく", "来": "くる", "出": "でる", "入": "はいる", "走": "はしる", "歩": "あるく", "止": "とまる", "立": "たつ", "坐": "すわる",
            "思": "おもう", "考": "かんがえる", "言": "いう", "話": "はなす", "語": "ご", "書": "かく", "読": "よむ", "聞": "きく", "見": "みる",
            "学": "まなぶ", "校": "こう", "教": "おしえる", "文": "ぶん", "字": "じ", "本": "ほん", "作": "つくる", "用": "よう", "強": "つよい", "弱": "よわい",
            "新": "あたらしい", "短": "みじかい", "低": "ひくい", "大": "おおきい", "小": "ちいさい", "何": "なに", "元": "げん", "交": "こう", "当": "あたる"
        };

        let selectedKanji = new Set();
        let quizList = [];
        let currentIdx = 0;
        let score = 0;

        // メニュー画面の生成
        function createMenu() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            for (const [category, kanjis] of Object.entries(kanjiCategories)) {
                const section = document.createElement('div');
                section.className = 'category-section';

                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = category;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'kanji-grid';

                kanjis.forEach(kanji => {
                    if (!kanjiDict[kanji]) return; // 読み定義がないものはスキップ
                    const btn = document.createElement('button');
                    btn.className = 'kanji-btn';
                    btn.innerText = kanji;
                    btn.dataset.kanji = kanji;
                    
                    if (selectedKanji.has(kanji)) {
                        btn.classList.add('selected');
                    }

                    btn.onclick = () => toggleKanji(btn, kanji);
                    grid.appendChild(btn);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        function toggleKanji(btn, kanji) {
            if (selectedKanji.has(kanji)) {
                selectedKanji.delete(kanji);
                btn.classList.remove('selected');
            } else {
                selectedKanji.add(kanji);
                btn.classList.add('selected');
            }
        }

        function selectAllKanji(select) {
            const buttons = document.querySelectorAll('.kanji-btn');
            buttons.forEach(btn => {
                const kanji = btn.dataset.kanji;
                if (select) {
                    selectedKanji.add(kanji);
                    btn.classList.add('selected');
                } else {
                    selectedKanji.delete(kanji);
                    btn.classList.remove('selected');
                }
            });
        }

        // クイズ開始
        function startQuiz() {
            if (selectedKanji.size === 0) {
                alert('漢字を1つ以上えらんでね！');
                return;
            }

            quizList = Array.from(selectedKanji);
            // ランダムにシャッフル
            quizList.sort(() => Math.random() - 0.5);
            
            currentIdx = 0;
            score = 0;

            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('total-questions').innerText = quizList.length;

            showQuestion();
        }

        // 問題の表示
        function showQuestion() {
            document.getElementById('current-question').innerText = currentIdx + 1;
            const currentKanji = quizList[currentIdx];
            document.getElementById('kanji-display').innerText = currentKanji;

            const correctAnswer = kanjiDict[currentKanji];
            
            // 誤答の選択肢を全漢字から集める
            let allReadings = Object.values(kanjiDict).filter(r => r !== correctAnswer);
            // 重複を削除してシャッフル
            allReadings = Array.from(new Set(allReadings)).sort(() => Math.random() - 0.5);

            // 4つの選択肢を作る
            const choices = [correctAnswer, allReadings[0], allReadings[1], allReadings[2]];
            // 選択肢をシャッフル
            choices.sort(() => Math.random() - 0.5);

            const choiceButtons = document.querySelectorAll('.choice-btn');
            choiceButtons.forEach((btn, index) => {
                btn.innerText = choices[index];
                btn.dataset.answer = choices[index];
                btn.style.background = '#f8f9fa';
                btn.style.borderColor = '#e9ecef';
                btn.disabled = false;
            });
        }

        // 答え合わせ
        function checkAnswer(selectedIndex) {
            const choiceButtons = document.querySelectorAll('.choice-btn');
            const selectedBtn = choiceButtons[selectedIndex];
            const currentKanji = quizList[currentIdx];
            const correctAnswer = kanjiDict[currentKanji];

            // 連続クリック防止
            choiceButtons.forEach(btn => btn.disabled = true);

            if (selectedBtn.dataset.answer === correctAnswer) {
                selectedBtn.style.background = '#d4edda';
                selectedBtn.style.borderColor = '#28a745';
                score++;
            } else {
                selectedBtn.style.background = '#f8d7da';
                selectedBtn.style.borderColor = '#dc3545';
                // 正解のボタンを緑色にする
                choiceButtons.forEach(btn => {
                    if (btn.dataset.answer === correctAnswer) {
                        btn.style.background = '#d4edda';
                        btn.style.borderColor = '#28a745';
                    }
                });
            }

            setTimeout(() => {
                currentIdx++;
                if (currentIdx < quizList.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1000);
        }

        // 結果画面
        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('result-text').innerText = `${quizList.length}もん 中 ${score}もん せいかい！`;
        }

        function backToMenu() {
            document.getElementById('menu-screen').style.display = 'block';
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
            createMenu();
        }

        // 初回読み込み
        createMenu();
    </script>
</body>
</html>
